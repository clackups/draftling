dependencies:
  idf:
    version: '>=6.1.0'
  lvgl/lvgl: "^9.2"

  ## Wi-Fi / Bluetooth on the ESP32-P4 are routed through the
  ## on-board ESP32-C6 co-processor via ESP-Hosted over SDIO (see
  ## docs/tab5-esp-hosted.md). `espressif/esp_hosted` is the host side;
  ## ESP-IDF 6.1's esp_wifi remote layer redirects the standard
  ## `esp_wifi_*` calls into its RPCs, so wifi_manager needs no
  ## P4-specific path. Only for `target == esp32p4`; ESP32-S3 / C5
  ## builds are unaffected.
  ##
  ## 3.1.x: the C6 must run esp-hosted 3.1 too, which
  ## misc/p4_upgrade_cp/ installs from the P4. 3.0 replaced the
  ## Bluetooth glue of 2.x (ble_keyboard.cpp uses
  ## esp_hosted_bt_host_stack_setup()); see the 3.0.0 section of
  ## esp-hosted-mcu's docs/migration.md.
  espressif/esp_hosted:
    version: "~3.1.0"
    rules:
      - if: "target == esp32p4"
